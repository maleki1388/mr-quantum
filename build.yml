name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create --org com.mrquantum --project-name mr_quantum app
          mkdir -p app/assets
          cp index.html app/assets/index.html
          curl -L -o app/assets/decimal.min.js https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cd app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MR-Quantum-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
